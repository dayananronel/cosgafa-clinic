name: CI & Deploy Preview

on:
  push:
    branches:
      - main
      - claude/flutter-project-from-md-8pegug
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.27.1"

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  deploy:
    name: Deploy web preview to GitHub Pages
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Pages deployments from different branches/commits race for the
    # same environment; this serializes them (queue, don't cancel) so a
    # push to main right after a push to the feature branch doesn't fail
    # outright — the GitHub-recommended pattern for this workflow shape.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # GitHub Pages serves this repo at /cosgafa-clinic/, so the app's
      # asset base href must match or every asset request 404s. The html
      # renderer avoids a runtime dependency on the external CanvasKit
      # CDN, so the preview keeps working on networks that block it.
      #
      # BACKEND=supabase points the deployed build at the real Phase 2
      # backend (supabase/README.md) instead of the in-memory demo.
      # Requires the SUPABASE_URL / SUPABASE_ANON_KEY repository secrets
      # to be set (Settings -> Secrets and variables -> Actions) --
      # without them BackendConfig.isSupabaseConfigured is false and the
      # app shows a "configuration needed" screen instead of the demo.
      - run: >
          flutter build web --release --web-renderer html
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=BACKEND=supabase
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      # enablement: true lets this action turn Pages on (source =
      # GitHub Actions) the first time it runs, instead of only
      # checking whether it's already configured.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
